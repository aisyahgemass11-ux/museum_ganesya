<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengguna - Museum Ganesya</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f6f0e5;
            color: #5a3827;
        }
        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            background: #fffdf9;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(70, 45, 25, 0.12);
        }
        .logo {
            text-align: center;
            font-size: 38px;
            margin-bottom: 8px;
        }
        h1 {
            margin: 0;
            text-align: center;
            font-size: 25px;
        }
        .subtitle {
            margin: 10px 0 25px;
            text-align: center;
            color: #806b5b;
            font-size: 14px;
        }
        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8c7b5;
            border-radius: 7px;
            font-size: 15px;
        }
        input:focus {
            outline: 2px solid #a98465;
            border-color: #a98465;
        }
        .login-button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #5a3827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .login-button:hover {
            background: #704a35;
        }
        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #76553f;
            font-size: 14px;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .error {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #f9e5e2;
            color: #963b30;
            font-size: 14px;
        }
        .success {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #e4f4e5;
            color: #286b35;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">✦</div>
        <h1>Museum Ganesya</h1>
        <p class="subtitle">Login Pengguna</p>
        <div id="error-message" class="error" hidden>
            Email atau password salah. Silakan coba lagi.
        </div>
        <div id="success-message" class="success" hidden>
            Pendaftaran berhasil! Silakan login menggunakan akun kamu.
        </div>
        <form action="login_pengguna.php" method="POST">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Masukkan email"
                autocomplete="email"
                required
            >
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
            >
            <button type="submit" class="login-button">
                Login
            </button>
        </form>
        <a href="daftar.php" class="back-link">
            Belum punya akun? Daftar Pengguna
        </a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("error") === "1") {
            document.getElementById("error-message").hidden = false;
        }
        if (params.get("daftar") === "berhasil") {
            document.getElementById("success-message").hidden = false;
        }
    </script>
</body>
</html>
